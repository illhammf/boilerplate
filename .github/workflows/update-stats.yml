name: 📊 Update Repo Stats

on:
  schedule:
    - cron: "0 */12 * * *"   # tiap 12 jam: 00:00 & 12:00 UTC = 07:00 & 19:00 WIB
  workflow_dispatch:          # tombol "Run workflow" manual
  push:                       # otomatis jalan tiap file ini diedit, jadi bisa langsung dites
    branches: [main]
    paths:
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write
  actions: write              # dipakai langkah keepalive di bawah

concurrency:
  group: update-stats
  cancel-in-progress: false

env:
  STATS_BRANCH: stats
  TZ: Asia/Jakarta

jobs:
  stats:
    name: 📈 Kumpulkan statistik
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v5

      - name: 🔑 Cek token
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret GH_TOKEN kosong. Isi di Settings → Secrets and variables → Actions → Repository secrets"
            exit 1
          fi

      - name: 📥 Ambil riwayat lama dari branch stats
        run: |
          mkdir -p stats
          if git ls-remote --exit-code --heads origin "$STATS_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$STATS_BRANCH"
            git show FETCH_HEAD:data.json > stats/data.json 2>/dev/null || echo '{"days":{}}' > stats/data.json
          else
            echo '{"days":{}}' > stats/data.json
          fi

      - name: 📊 Ambil dan hitung statistik
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"

          api() {
            curl -sS --retry 3 --retry-delay 5 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$repo/$1"
          }

          VIEWS=$(api traffic/views)
          CLONES=$(api traffic/clones)

          # Gagal terang-terangan kalau token/izin salah, jangan diam-diam menulis 0
          echo "$VIEWS"  | jq -e '.views'  >/dev/null || { echo "::error::Gagal ambil views: $(echo "$VIEWS" | tr -d '\n' | tr -s ' ')";  exit 1; }
          echo "$CLONES" | jq -e '.clones' >/dev/null || { echo "::error::Gagal ambil clones: $(echo "$CLONES" | tr -d '\n' | tr -s ' ')"; exit 1; }

          # Tambahan (opsional): sumber kunjungan dan halaman terpopuler
          REFS=$(api traffic/popular/referrers);  echo "$REFS"  | jq -e 'type=="array"' >/dev/null 2>&1 || REFS='[]'
          PATHS=$(api traffic/popular/paths);     echo "$PATHS" | jq -e 'type=="array"' >/dev/null 2>&1 || PATHS='[]'

          # Gabungkan data 14 hari terakhir ke riwayat (hari yang sama ditimpa)
          jq --argjson v "$VIEWS" --argjson c "$CLONES" '
            reduce $v.views[]   as $d (.; .days[$d.timestamp[0:10]] += {views: $d.count,  view_uniques:  $d.uniques})
            | reduce $c.clones[] as $d (.; .days[$d.timestamp[0:10]] += {clones: $d.count, clone_uniques: $d.uniques})
          ' stats/data.json > stats/data.tmp && mv stats/data.tmp stats/data.json

          sum() { jq "[.days[].$1 // 0] | add // 0" stats/data.json; }
          TV=$(sum views);   TVU=$(sum view_uniques)
          TC=$(sum clones);  TCU=$(sum clone_uniques)
          UPDATED=$(date +'%d %b %Y, %H:%M WIB')

          # Badge abu-abu kalau nilainya 0, berwarna kalau sudah ada isinya
          color() { if [ "$1" -gt 0 ]; then echo "$2"; else echo lightgrey; fi; }
          badge() {
            jq -n --arg l "$1" --arg m "$2" --arg c "$3" \
              '{schemaVersion: 1, label: $l, message: $m, color: $c}' > "stats/$4"
          }
          badge "total"  "$TV"      "$(color "$TV"  blue)"       views.json
          badge "total"  "$TVU"     "$(color "$TVU" blueviolet)" unique_views.json
          badge "total"  "$TC"      "$(color "$TC"  green)"      clones.json
          badge "total"  "$TCU"     "$(color "$TCU" teal)"       unique_clones.json
          badge "update" "$UPDATED" lightgrey                    updated.json

          # Grafik mini tren views 14 hari terakhir
          SPARK=$(jq -r '
            (.days | to_entries | sort_by(.key) | .[-14:] | map(.value.views // 0)) as $v
            | ($v | max // 0) as $m
            | $v | map(if $m == 0 then 0 else (. * 7 / $m | floor) end)
            | map(["▁","▂","▃","▄","▅","▆","▇","█"][.]) | join("")' stats/data.json)

          # Ringkasan yang tampil di halaman run (tab Actions)
          {
            echo "## 📊 Statistik Repo"
            echo ""
            echo "| | Total | Unik (per hari) |"
            echo "|---|---:|---:|"
            echo "| 👀 Views  | $TV | $TVU |"
            echo "| 📦 Clones | $TC | $TCU |"
            echo ""
            echo "**Tren views 14 hari terakhir:** \`${SPARK:-—}\`"
            echo ""
            echo "🕒 Diperbarui: $UPDATED"
            if [ "$(echo "$REFS" | jq 'length')" -gt 0 ]; then
              echo ""
              echo "### 🔗 Sumber kunjungan teratas"
              echo "| Sumber | Views | Unik |"
              echo "|---|---:|---:|"
              echo "$REFS" | jq -r '.[:5][] | "| \(.referrer) | \(.count) | \(.uniques) |"'
            fi
            if [ "$(echo "$PATHS" | jq 'length')" -gt 0 ]; then
              echo ""
              echo "### 📄 Halaman terpopuler"
              echo "| Halaman | Views | Unik |"
              echo "|---|---:|---:|"
              echo "$PATHS" | jq -r '.[:5][] | "| \(.path) | \(.count) | \(.uniques) |"'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Views=$TV (unik $TVU) | Clones=$TC (unik $TCU) | $UPDATED"

      - name: 🚀 Publikasi ke branch stats
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd stats
          git init -q -b "$STATS_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "🤖 stats: $(date +'%Y-%m-%d %H:%M WIB')"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          # Riwayat angka tersimpan di data.json, jadi branch cukup berisi 1 commit terbaru
          git push --force origin "$STATS_BRANCH"

      - name: 💓 Keepalive (cegah jadwal dimatikan GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-stats.yml/enable" \
            || echo "Keepalive dilewati (tidak fatal)"